[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "konverter-backend"
version = "0.2.0"
description = "FastAPI backend for the Konverter accessible-document review workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<0.140",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pymupdf>=1.26.6,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pypdfium2>=5,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
docling = [
  "docling>=2.118.1,<3",
]
dev = [
  "pypdf>=6,<7",
  "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
