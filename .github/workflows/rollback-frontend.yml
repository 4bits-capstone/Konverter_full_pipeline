name: Rollback frontend

# Manually redeploy an earlier frontend image to Lightsail:
# Actions -> Rollback frontend -> Run workflow -> enter a tag like sha-abc1234.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back frontend on Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          TAG: ${{ inputs.tag }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
        run: bash .github/scripts/deploy-lightsail.sh "$TAG"
