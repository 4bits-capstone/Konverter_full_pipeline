name: CI

on:
  push:
    branches: [main]
    # Docs-only merges don't rebuild or offer a deploy. A push that also
    # touches any other file runs everything as usual.
    # "*.md" is root-level only, so Markdown inside backend/ or src/ (which
    # the app might read, e.g. prompts) still triggers a build.
    paths-ignore:
      - "docs/**"
      - "*.md"
  # No path filter here: the 3 checks are required, so a PR that skipped
  # them could never be merged.
  pull_request:
  workflow_dispatch:

# Cancel an older PR run when a newer commit arrives; never cancel runs on main
# (they publish images).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Built in each job rather than passed as a job output: the name contains the
# Docker Hub username, which is also a secret, so GitHub drops that output.
env:
  IMAGE: linnhtinnyo/konverter-backend
  FRONTEND_IMAGE: ghcr.io/4bits-capstone/konverter-frontend

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Run pytest
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Check chat widget bundle is up to date
        run: |
          npm run build:widget
          git diff --exit-code -- backend/app/static/widget/ || {
            echo "::error::backend/app/static/widget/ is stale - run 'npm run build:widget' and commit the result."
            exit 1
          }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-backend:
    name: Publish backend image
    # Only after every check passes, and only for commits that landed on main.
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Summary
        run: |
          echo "### Published backend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy backend to RunPod
    needs: publish-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for a required reviewer to approve; secrets below only exist there.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Update pod and wait for health check
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        # Exact commit tag (matches metadata-action's 7-char type=sha tag), never :latest.
        run: bash .github/scripts/deploy-runpod.sh "$IMAGE:sha-${GITHUB_SHA::7}" "$GITHUB_SHA"
      - name: Summary
        run: |
          echo "### Deployed to RunPod" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: Actions -> Rollback backend -> Run workflow, with an earlier sha- tag." >> "$GITHUB_STEP_SUMMARY"

  publish-frontend:
    name: Publish frontend image
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check build settings
        # Vite bakes these into the bundle; without them the site would point
        # at localhost/placeholders, so refuse to publish.
        env:
          API: ${{ vars.VITE_API_BASE_URL }}
          SB_URL: ${{ vars.VITE_SUPABASE_URL }}
          SB_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [[ -n "$API" ]] || missing+=" VITE_API_BASE_URL"
          [[ -n "$SB_URL" ]] || missing+=" VITE_SUPABASE_URL"
          [[ -n "$SB_KEY" ]] || missing+=" VITE_SUPABASE_ANON_KEY"
          if [[ -n "$missing" ]]; then
            echo "::error::Repository variables not set:$missing"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Summary
        run: |
          echo "### Published frontend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend to Lightsail
    needs: publish-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Separate from the backend's lock so the two deploys don't queue on each other.
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
        run: bash .github/scripts/deploy-lightsail.sh "sha-${GITHUB_SHA::7}"
      - name: Summary
        run: |
          echo "### Deployed frontend to Lightsail" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$FRONTEND_IMAGE:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: Actions -> Rollback frontend -> Run workflow, with an earlier sha- tag." >> "$GITHUB_STEP_SUMMARY"
